id: tmp
schema_version: 1
version: 0.4
depends:
  - wiki
updated: 2026-11-09
attachment:
  - "wiki/tmp/ — temporary zone (the path is the territory; instance data — real contents never enter the framework repo or test-repo)"
fields: {}
inject: "Temporary zone `wiki/tmp/` (path = territory): drafts and intermediates, no retention promise, invisible to the derived layer; promote precious drafts (draft deleted on promotion); set `stale_after` — deletion only on confirmation; details PLUGIN.md"
usage:
  - Drafts / parsing scratch: land directly at `wiki/tmp/<name>.md`, frontmatter kept simple (title + optional stale_after); broken links may stay as written
  - Promotion: content distilled via save into notes or merged into the target territory (a project decision section, etc.); delete the draft after the links close (agent-created drafts deleted by the agent; human drafts upon confirmation)
  - Cleanup: check reports the stale over-age list → delete after confirmation; long-unpromoted drafts go to the user for keep-or-drop adjudication
checks:
  - Semantic (v0.1 manual, attached audit deferred): type: tmp landing outside wiki/tmp/ → error; stale_after already past → warning (cleanup prompt); tmp page count > 20 → info (backlog triage)

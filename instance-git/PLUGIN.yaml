inject: "Instance git = snapshot ledger of real use (rollback + time machine), never a collaboration face: the agent commits at transaction close (`type: summary`), the kernel never touches git; credentials/session files never tracked; contract PLUGIN.md"
usage:
  - Package transactions: after validate goes green, one commit at close — mechanical + semantic in one snapshot (message `plugin: <verb> <pkg> [v<version>]`); see the plugin command's Transaction close section
  - Session close: commit the dirty tree the session leaves (`type: summary`, optional `[domain]` tag — the same shape as a log entry); no other rhythm is mandated
  - Recovery entrance: a check-flagged page → `git log -- <page>` (who changed it, when) → `git checkout -- <page>` (yesterday's truth back)
  - Upgrade path FYI: pure local (default) → a `git bundle` copied elsewhere → a private remote (sweep sensitive faces first); public remotes are out of the question for an instance
checks:
  - Mechanical (attached audit, read-only): ignore-rule vs tracked-file residue; credential-pattern filenames tracked; sensitive faces tracked while a remote is configured; projects/*/ self-git repos tracked by the parent — all warnings, the script never writes

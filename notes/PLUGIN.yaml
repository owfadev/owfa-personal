id: notes
schema_version: 1
version: 0.16
bridge: 按需
depends:
  - wiki
updated: 2026-11-09
attachment:
  - "wiki/notes/ — native notes zone"
fields: {}
commands:
  - owfa-save
inject: "Native notes `wiki/notes/`: knowledge born in the wiki, open `type` vocabulary (defaults in registry); commands append, never modify; session/profile pages live in their own territories; domain derivations must back-link the source; details PLUGIN.md"
usage:
  - Landing spot `wiki/notes/<title>.md`, file name free (named by humans); type form vocabulary in registry (open, self-extended by instances), territory values do not land in this zone
  - Append-only: commands never rewrite an existing note wholesale; updating = append-style merge under user instruction (trace left in the body) or manual human edits
checks:
  - Traces of a note overwritten by a command → error
  - Near-duplicate notes (Jaccard > 0.7) → warning

id: log
schema_version: 1
version: 0.16
bridge: 必依
depends:
  - wiki
updated: 2026-11-09
attachment:
  - "wiki/log.md — single-file operation journal (rolling window)"
  - "wiki/archive/YYYY-MM/log.md — archive spillover (immutable zone, grouped by entry month)"
  - "scripts/check.py — attached audit (entry date contract)"
fields: {}
inject: "Run log `wiki/log.md`: prepend, never rewrite; entry = date + type (map/save/query/check/plugin/todo/profile/other) + optional [domain] + one sentence, written via `pipeline.py log`; >100 entries auto-archived; details PLUGIN.md"
usage:
  - Writing lines (mechanical, automatic): `python .owfa/scripts/pipeline.py log <type> "<one sentence>" [--domain <domain>]` (type value set in the log block of the AGENTS injection region; domain tag = domain-plugin name such as bb/lark/vault, mandatory for in-domain transactions, omitted for framework and native transactions); rolling window and archiving are performed by the script
checks:
  - Mechanical items (attached-audit script `scripts/check.py`, executed on audit discovery): undated entries (starting with `- ` yet not matching the date format, main file and archive checked alike) → error
  - Semantic items (check command): historical entries modified (verifiable via git) → error; capacity over the limit → re-check after mechanical archiving

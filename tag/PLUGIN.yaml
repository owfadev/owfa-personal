id: tag
schema_version: 1
version: 0.13
depends:
  - wiki
updated: 2026-11-12
attachment:
  - "Cross-cutting plugin: owns the frontmatter tags field across all pages plus vocabulary governance"
  - "scripts/check.py — attached audit (>5 per page / restating type / hierarchy depth)"
fields:
  tags: "YAML list ≤5; primary language follows the language page's default key (absent → session language); English tags lowercase kebab-case; hierarchy ≤2, `/` separated; restating type forbidden"
inject: "Page `tags`: YAML list, ≤5 per page, hierarchy ≤2 (`/`); language follows the `wiki/language.md` default (absent → session language); English tags lowercase kebab-case; open semantics, never restate `type`"
usage:
  - Before writing, read `wiki/tags.md` and prefer reusing existing terms
  - New-term conventions: primary language follows the language page's default key (absent → session language, preventing mixed Chinese-English fragmentation of the vocabulary); English lowercase kebab-case; hierarchy ≤2; ≤5 per page; restating type forbidden
checks:
  - Mechanical items (attached-audit script `scripts/check.py`, executed on audit discovery): >5 tags on one page → warning; tags restating type → warning; hierarchy over the limit (parent/child ≤2) or empty segment → warning
  - Semantic items (check command): near-duplicate tags → warning suggesting a merge; merging is a mechanically-confirmed item (list presented, executed after user confirmation)
